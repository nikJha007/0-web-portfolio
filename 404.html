<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Your Name</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
  .oops {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .oops .code {
    font: 600 clamp(56px, 14vw, 120px)/1 var(--mono);
    color: var(--accent);
    letter-spacing: -.04em;
  }
  .oops h1 { margin: 16px 0 12px; font-size: clamp(22px, 4vw, 30px); }
  .oops p { color: var(--muted); margin-bottom: 32px; }
</style>
</head>
<body>
  <main class="oops wrap">
    <p class="code">404</p>
    <h1>That page doesn't exist.</h1>
    <p>The link may be out of date, or the address may have a typo in it.</p>
    <a class="btn btn-primary" href="/">Back to the homepage</a>
  </main>
</body>
</html>
