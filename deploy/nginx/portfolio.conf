# ===========================================================================
# nginx server block for the portfolio, targeting Amazon Linux 2023.
#
# Install:
#   sudo cp deploy/nginx/portfolio.conf /etc/nginx/conf.d/portfolio.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Note: on Amazon Linux there is no sites-available/sites-enabled pair.
# Files in /etc/nginx/conf.d/*.conf are picked up automatically.
#
# Run certbot AFTER this file is in place and DNS resolves. Certbot rewrites
# this block to add the TLS listener and an HTTP-to-HTTPS redirect, so do not
# hand-write a 443 block here first.
# ===========================================================================

# default_server makes this block answer any request on port 80 that doesn't
# match another server_name. Amazon Linux's stock nginx.conf defines its own
# port-80 block for the welcome page, and without default_server here, which
# one wins depends on include order. This is a single-site box, so claiming
# the default is what we want: the bare public IP serves the portfolio.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # EDIT: your domain. Harmless to leave as-is while you test over the raw
    # IP, since default_server already catches those requests.
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/portfolio;
    index index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Fingerprinted or rarely-changing assets: cache hard.
    location ~* \.(css|js|svg|png|jpe?g|webp|avif|woff2?|ico|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # HTML must not be cached, or edits won't show up for returning visitors.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Don't serve dotfiles (.git, .env) even if they end up in the web root.
    location ~ /\. {
        deny all;
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security headers. CSP is deliberately strict: this site loads no
    # third-party scripts, fonts, or images. If you add an embed or an
    # analytics snippet later you must widen the relevant directive.
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;

    server_tokens off;

    access_log /var/log/nginx/portfolio.access.log;
    error_log  /var/log/nginx/portfolio.error.log warn;
}
